backend = "glx"

# blur
blur-background = true;
blur-method = "dual_kawase"
blur-strength = 2;

# Opacity
active-opacity = 1;
inactive-opacity = 1;

# fading
fading = false;

# Other
refresh-rate = 0;
vsync = true;
detect-rounded-corners = true;
detect-client-opactiy = true;
detect-transient = true;
detect-client-leader = true;
